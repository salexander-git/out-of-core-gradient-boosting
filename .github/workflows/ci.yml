name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      # California Housing is fetched by scikit-learn inside the tests; it is never committed.
      - name: Cache scikit-learn datasets
        uses: actions/cache@v4
        with:
          path: ~/scikit_learn_data
          key: sklearn-data-california-v1

      - name: Configure and build (gcc, -Wall)
        run: |
          g++ --version | head -1
          cmake -S . -B build -DPython_EXECUTABLE="$(which python)"
          cmake --build build -j

      - name: Test
        run: python -m pytest -v
